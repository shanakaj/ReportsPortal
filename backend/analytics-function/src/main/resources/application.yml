spring:
  application:
    name: analytics-function
  main:
    web-application-type: servlet

cognito:
  user-pool-id: ${COGNITO_USER_POOL_ID:ap-southeast-2_placeholder}
  client-id: ${COGNITO_CLIENT_ID:placeholder}
  region: ${AWS_REGION:ap-southeast-2}

aws:
  region: ${AWS_REGION:ap-southeast-2}

dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:}
  tables:
    analytics: ${ANALYTICS_TABLE:ReportPortal-Analytics}
    audit-log: ${AUDIT_LOG_TABLE:ReportPortal-AuditLog}
    notifications: ${NOTIFICATIONS_TABLE:ReportPortal-Notifications}

s3:
  export-bucket: ${EXPORT_BUCKET:report-portal-exports}

ses:
  from-address: ${SES_FROM_ADDRESS:noreply@reports.yourdomain.com}

eventbridge:
  bus-name: ${EVENT_BUS_NAME:report-portal-events}
  source: com.versent.reportportal

logging:
  level:
    com.versent.reportportal: INFO
